source-file ~/.config/tmux/tmux.reset.conf
# Set the prefix to ctrl-a
set -g prefix C-a

# Default colors and terminal
# set -g default-terminal "tmux-256color"
# set -as terminal-features ',*:RGB'
# set -as terminal-overrides ',*:Tc'
# set -g focus-events on
set-option -g default-terminal "screen-256color"
set-option -g terminal-overrides ",xterm-256color:RGB"
# Windows Terminal handles synchronized output but tmux cannot detect it.
# Without it, a redraw in another pane (the agent sidebar's clock) shows
# the cursor jumping there and back.
set -as terminal-features ",xterm-256color:sync"

# set -g allow-passthrough on

# Add double borders for windows
set -g pane-border-lines double

# set-option -g terminal-overrides ",xterm-256color:RGB"
set -g base-index 1           		# Set window numbering to start at 1
set -g detach-on-destroy off		# Don't exit on detach
set -g escape-time 0			# Zero out escape time delay
set -g history-limit 1000000		# Increase history size
set -g renumber-windows on		# Renumber al windows when any window is closed
set -g set-clipboard on 		# Use system clipboard
set -g status-position top 		# Better UX
set -g default-terminal "${TERM}"

# more visible active panes
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Remove the old binding
unbind C-b

# Send Ctrl-a to applications by pressing it twice
bind C-a send-prefix

# better find
# bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key "f" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Directories' tv dirs ~

# cheatsheet
bind-key -r i run-shell "tmux neww ~/.local/bin/tmux-cht.sh"

# agents
bind-key "a" display-popup -E -w 80% -h 70% "tv agents"

# sesh
bind-key "o" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sessions' tv sesh

# # Toggle popup
bind-key -n M-3 run-shell 'toggle-tmux-popup.sh'

# Agent sidebar: M-2 shows it in this window, or closes it if it is here.
# It is one pane that the hooks below move into whichever window you are
# looking at. The [10] slot keeps a re-source from stacking copies and
# leaves the unindexed slot to plugins.
bind-key -n M-2 run-shell 'agent-sidebar-tmux toggle'
set-hook -g session-window-changed[10] 'run-shell -b "agent-sidebar-tmux follow"'
set-hook -g client-session-changed[10] 'run-shell -b "agent-sidebar-tmux follow"'
set-hook -g client-attached[10] 'run-shell -b "agent-sidebar-tmux follow"'
set-hook -g client-resized[10] 'run-shell -b "agent-sidebar-tmux follow"'
set-hook -g window-layout-changed[10] 'run-shell -b "agent-sidebar-tmux follow"'
set-hook -g after-resize-pane[10] 'run-shell -b "agent-sidebar-tmux follow"'
set-hook -g pane-exited[10] 'run-shell -b "agent-sidebar-tmux follow"'
set-hook -g after-kill-pane[10] 'run-shell -b "agent-sidebar-tmux follow"'

# Better last session
bind -N "last-session (via sesh) " L run-shell "sesh last"

# Tab based window selection
bind -n C-Tab select-window -n
bind -n C-S-Tab select-window -p

# PLUGINS
# Install tmux-ressurect and tmux-continuum
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/catppuccin-tmux' 

# New
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'omerxx/tmux-floax'

# set -g @floax-width '80%'
# set -g @floax-height '80%'
# set -g @floax-border-color 'magenta'
# set -g @floax-text-color 'blue'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/.dotfiles'
set -g @sessionx-window-height '65%'
set -g @sessionx-window-width '65%'
set -g @sessionx-preview-location 'right'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'

# set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
# A restored sidebar would come back as a bare shell in its slot.
set -g @resurrect-hook-post-save-layout 'agent-sidebar-tmux prune-resurrect'

# Set color theme
# set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator "  █"

set -g @catppuccin_window_default_fill "number"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#{pane_current_path}"

set -g @catppuccin_status_modules_right "application session date_time"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "yes"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"

# Initialize TMUX plugin manager (keep this line at the bottom of tmux.conf;
# only settings that have to see what the plugins set may follow it)
run '~/.tmux/plugins/tpm/tpm'

# Agent counts in front of catppuccin's status modules. This has to follow
# tpm, because catppuccin writes status-right when it loads, and it only
# takes modules from its own plugin folder. -F copies the modules in as they
# are; ## keeps the #() for tmux to run on every status refresh.
set -gF status-right "##(agent-scan --tmux)#{status-right}"
